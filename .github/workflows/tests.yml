name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Include pinned browser setup and slow hosted Windows disk flushes in
    # the budget while retaining the complete durable recovery suite.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Set up pinned LevelDB runtime host
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact Office LevelDB dependency
        env:
          LARJ_LEVELDB_RUNTIME: ${{ runner.temp }}/larj-leveldb-runtime
        run: python -m local_agent_record_janitor.office_leveldb --install

      - name: Install hash-pinned Paseo browser test dependency
        if: matrix.os == 'windows-latest'
        run: python -m tests.install_paseo_electron "${{ runner.temp }}/larj-paseo-electron"

      - name: Run unit tests
        env:
          LARJ_LEVELDB_RUNTIME: ${{ runner.temp }}/larj-leveldb-runtime
          LARJ_REQUIRE_LEVELDB_TESTS: "1"
          LARJ_PASEO_ELECTRON_RUNTIME: ${{ runner.temp }}/larj-paseo-electron
          LARJ_REQUIRE_PASEO_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Set up pinned Rust fingerprint oracle
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Compare Herdr fingerprints with upstream serializer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"
        run: python -m tests.herdr_fingerprint_oracle
