[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-record-janitor"
version = "0.2.0"
description = "Audit storage-qualified Codex threads, Pi Agent and Claude Code sessions, and frontend references; safely clean explicitly approved local agent records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fang Jun" }
]
keywords = ["codex", "pi", "pi-agent", "claude", "claude-code", "aionui", "cindy", "thread", "session", "record", "local-agent", "consistency", "cleanup"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = ["tomli>=2.0.1,<2.4; python_version < '3.11'"]

[project.scripts]
local-agent-record-janitor = "local_agent_record_janitor.cli:main"

[project.urls]
Homepage = "https://github.com/SchweppesSoda/local-agent-record-janitor"
Issues = "https://github.com/SchweppesSoda/local-agent-record-janitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_agent_record_janitor = ["workbuddy_schema_562.json", "orca_startup_0160.json", "office_schemas.json", "leveldb_runtime/*.cjs", "leveldb_runtime/*.json"]
